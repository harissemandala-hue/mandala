services:
  - type: web
    name: transitmanager
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DB_PATH
        value: /var/data/transitmanager.db
    disk:
      name: transitmanager-data
      mountPath: /var/data
      sizeGB: 1
